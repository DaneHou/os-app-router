[update_lists]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/list_updater.py update
parameters:
type:script
message:Updating AppRouter domain and CIDR lists
description:AppRouter list update

[force_update]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/list_updater.py force
parameters:
type:script
message:Force updating AppRouter lists
description:AppRouter forced list update

[generate_dns]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/list_updater.py generate_dns
parameters:
type:script
message:Regenerating AppRouter DNS configs
description:AppRouter DNS config generation

[status]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/list_updater.py status
parameters:
type:script_output
message:Getting AppRouter status
description:AppRouter status

[table_stats]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/table_manager.sh show
parameters:
type:script_output
message:Getting AppRouter table statistics
description:AppRouter table stats

[reload_tables]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/table_manager.sh reload_all
parameters:
type:script
message:Reloading AppRouter pf tables
description:AppRouter table reload

[dns_watcher_start]
command:/usr/sbin/daemon -f -p /var/run/approuter_dns_watcher.pid -S -T approuter-dns /usr/local/opnsense/scripts/OPNsense/Approuter/dns_watcher.py start
parameters:
type:script
message:Starting AppRouter DNS watcher
description:AppRouter DNS watcher start

[dns_watcher_restart]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/dns_watcher.py stop; /usr/sbin/daemon -f -p /var/run/approuter_dns_watcher.pid -S -T approuter-dns /usr/local/opnsense/scripts/OPNsense/Approuter/dns_watcher.py start
parameters:
type:script
message:Restarting AppRouter DNS watcher
description:AppRouter DNS watcher restart

[dns_watcher_reload]
command:/bin/pkill -HUP -F /var/run/approuter_dns_watcher.pid
parameters:
type:script
message:Reloading AppRouter DNS watcher mappings
description:AppRouter DNS watcher reload

[dns_watcher_stop]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/dns_watcher.py stop
parameters:
type:script
message:Stopping AppRouter DNS watcher
description:AppRouter DNS watcher stop

[dns_watcher_status]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/dns_watcher.py status
parameters:
type:script_output
message:Getting AppRouter DNS watcher status
description:AppRouter DNS watcher status

[geo_prober_start]
command:/usr/sbin/daemon -f -p /var/run/approuter_geo_prober.pid -S -T approuter-geo /usr/local/opnsense/scripts/OPNsense/Approuter/geo_prober.py start
parameters:
type:script
message:Starting AppRouter Geo Prober
description:AppRouter Geo Prober start

[geo_prober_stop]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/geo_prober.py stop
parameters:
type:script
message:Stopping AppRouter Geo Prober
description:AppRouter Geo Prober stop

[geo_prober_status]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/geo_prober.py status
parameters:
type:script_output
message:Getting AppRouter Geo Prober status
description:AppRouter Geo Prober status

[geo_prober_reload]
command:/bin/pkill -HUP -F /var/run/approuter_geo_prober.pid
parameters:
type:script
message:Reloading AppRouter Geo Prober config
description:AppRouter Geo Prober reload

[dns_forward]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/dns_forward.php
parameters:
type:script_output
message:App Router: resolve DNS via gateway

[leak_check]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/leak_check.py
parameters:
type:script_output
message:App Router: leak check

[inspect_trace]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/inspect_route.py trace
parameters:%s %s
type:script_output
message:App Router: inspect route

[inspect_connections]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/inspect_route.py connections
parameters:%s
type:script_output
message:App Router: inspect connections

[inspect_clients]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/inspect_route.py clients
parameters:
type:script_output
message:App Router: list rule clients

[agh_resync]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/agh_resync.py
parameters:
type:script_output
message:App Router: sync AdGuard Home upstreams with DNS via gateway

[agh_check]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/agh_resync.py --check
parameters:
type:script_output
message:App Router: check AdGuard Home upstreams

[unbound_flush]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/unbound_flush.py
parameters:
type:script
message:App Router: flush Unbound failures for forward zones

[healthcheck]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/healthcheck.py
parameters:
type:script_output
message:App Router: health check
description:App Router health check
