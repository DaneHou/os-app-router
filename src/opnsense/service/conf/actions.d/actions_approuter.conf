[update_lists]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/list_updater.py update
parameters:
type:script
message:Updating AppRouter domain and CIDR lists
description:AppRouter list update

[force_update]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/list_updater.py force
parameters:
type:script
message:Force updating AppRouter lists
description:AppRouter forced list update

[generate_dns]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/list_updater.py generate_dns
parameters:
type:script
message:Regenerating AppRouter DNS configs
description:AppRouter DNS config generation

[status]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/list_updater.py status
parameters:
type:script_output
message:Getting AppRouter status
description:AppRouter status

[table_stats]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/table_manager.sh show
parameters:
type:script_output
message:Getting AppRouter table statistics
description:AppRouter table stats

[reload_tables]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/table_manager.sh reload_all
parameters:
type:script
message:Reloading AppRouter pf tables
description:AppRouter table reload

[dns_watcher_start]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/dns_watcher.py start
parameters:
type:script
message:Starting AppRouter DNS watcher
description:AppRouter DNS watcher start

[dns_watcher_stop]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/dns_watcher.py stop
parameters:
type:script
message:Stopping AppRouter DNS watcher
description:AppRouter DNS watcher stop

[dns_watcher_status]
command:/usr/local/opnsense/scripts/OPNsense/Approuter/dns_watcher.py status
parameters:
type:script_output
message:Getting AppRouter DNS watcher status
description:AppRouter DNS watcher status
