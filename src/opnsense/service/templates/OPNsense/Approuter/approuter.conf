{#
    OPNsense AppRouter configuration template
    Generates config.json consumed by Python scripts.
    All user supplied strings go through |tojson so quotes, backslashes
    (e.g. regex probe patterns) and control characters can't break the JSON.
#}
{% if not helpers.empty('OPNsense.Approuter.general.enabled') %}
{
    "enabled": {{ OPNsense.Approuter.general.enabled|default("0", true)|int(0) }},
    "dns_resolver": {{ OPNsense.Approuter.general.dnsResolver|default("dnsmasq", true)|tojson }},
    "update_interval": {{ OPNsense.Approuter.general.updateInterval|default("daily", true)|tojson }},
    "table_prefix": {{ OPNsense.Approuter.general.tablePrefix|default("approuter", true)|tojson }},
    "sources": {
        "china_domains": {
            "url": {{ OPNsense.Approuter.lists.chinaDomainUrl|default("https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/accelerated-domains.china.conf", true)|tojson }},
            "type": "dnsmasq",
            "description": "China accelerated domains"
        },
        "china_cidrs_v4": {
            "url": {{ OPNsense.Approuter.lists.chinaCidrUrl|default("https://raw.githubusercontent.com/misakaio/chnroutes2/master/chnroutes.txt", true)|tojson }},
            "type": "cidr",
            "description": "China IPv4 CIDR blocks"
        }
    },
    "custom_domains": {{ OPNsense.Approuter.lists.customDomains|default("", true)|tojson }},
    "custom_cidrs": {{ OPNsense.Approuter.lists.customCidrs|default("", true)|tojson }},
    "custom_categories": [
{% if helpers.exists('OPNsense.Approuter.customCategories.category') %}
{% for cat in helpers.toList('OPNsense.Approuter.customCategories.category') %}
        {
            "slug": {{ cat.slug|default("", true)|tojson }},
            "label": {{ cat.label|default("", true)|tojson }},
            "domains": {{ cat.domains|default("", true)|tojson }},
            "cidrs": {{ cat.cidrs|default("", true)|tojson }}
        }{% if not loop.last %},{% endif %}

{% endfor %}
{% endif %}
    ],
    "rules": [
{% if helpers.exists('OPNsense.Approuter.rules.rule') %}
{% for rule in helpers.toList('OPNsense.Approuter.rules.rule')|selectattr('enabled', 'equalto', '1') %}
        {
            "uuid": {{ rule['@uuid']|default("", true)|tojson }},
            "description": {{ rule.description|default("", true)|tojson }},
            "source_nets": {{ rule.sourceNets|default("", true)|tojson }},
            "categories": {{ rule.categories|default("", true)|tojson }},
            "custom_domains": {{ rule.customDomains|default("", true)|tojson }},
            "gateway": {{ rule.gateway|default("", true)|tojson }},
            "interface": {{ rule.interface|default("lan", true)|tojson }},
            "smart_gateway": {{ rule.smartGateway|default("0", true)|tojson }},
            "probe_url": {{ rule.probeUrl|default("", true)|tojson }},
            "probe_interval": {{ rule.probeInterval|default("300", true)|int(300) }},
            "probe_method": {{ rule.probeMethod|default("connect_only", true)|tojson }},
            "probe_pattern": {{ rule.probePattern|default("", true)|tojson }}
        }{% if not loop.last %},{% endif %}

{% endfor %}
{% endif %}
    ]
}
{% endif %}
