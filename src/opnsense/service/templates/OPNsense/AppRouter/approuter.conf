{#
    OPNsense AppRouter configuration template
    Generates config.json consumed by Python scripts
#}
{% if not helpers.empty('OPNsense.AppRouter.general.enabled') %}
{
    "enabled": {{ OPNsense.AppRouter.general.enabled|default("0") }},
    "dns_resolver": "{{ OPNsense.AppRouter.general.dnsResolver|default("dnsmasq") }}",
    "update_interval": "{{ OPNsense.AppRouter.general.updateInterval|default("daily") }}",
    "table_prefix": "{{ OPNsense.AppRouter.general.tablePrefix|default("approuter") }}",
    "sources": {
        "china_domains": {
            "url": "{{ OPNsense.AppRouter.lists.chinaDomainUrl|default("https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/accelerated-domains.china.conf") }}",
            "type": "dnsmasq",
            "description": "China accelerated domains"
        },
        "china_cidrs_v4": {
            "url": "{{ OPNsense.AppRouter.lists.chinaCidrUrl|default("https://raw.githubusercontent.com/ruijzhan/chnroute/master/chnroute.txt") }}",
            "type": "cidr",
            "description": "China IPv4 CIDR blocks"
        }
    },
    "custom_domains": "{{ OPNsense.AppRouter.lists.customDomains|default("") }}",
    "custom_cidrs": "{{ OPNsense.AppRouter.lists.customCidrs|default("") }}",
    "rules": [
{% if helpers.exists('OPNsense.AppRouter.rules.rule') %}
{% for rule in helpers.toList('OPNsense.AppRouter.rules.rule') %}
{% if rule.enabled == '1' %}
        {
            "description": "{{ rule.description|default("") }}",
            "source_nets": "{{ rule.sourceNets|default("") }}",
            "categories": "{{ rule.categories|default("") }}",
            "gateway": "{{ rule.gateway|default("") }}",
            "interface": "{{ rule.interface|default("lan") }}"
        }{% if not loop.last %},{% endif %}

{% endif %}
{% endfor %}
{% endif %}
    ]
}
{% endif %}
